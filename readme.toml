description = "本仓库包含智能科学与工程学院开设的自动化类、计算机科学与技术学院开设的计算机类、信息科学与技术学院开设的通信类和集成电路学院开设的集成电路类等电子信息类跨专业课程。"

[[courses]]
name = "电子封装可靠性"

[[courses.sections]]
title = "课程概况"

[[courses.sections.items]]
content = """
大约有 10 次左右的点名考勤，还是比较频繁的；但是老师人很好。

作业有两个：

- 给定题目，写一份 7000 字课程论文
- 自选主题，作大约 8 分钟的课上汇报

开卷考试，打印资料就能过。
"""
author = { name = "IcyDesert", link = "https://github.com/IcyDesert", date = "2026-01" }

